[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "play2learn-lunarlander"
version = "2.0.0"
description = "Laboratorio didattico di Reinforcement Learning per studenti di scuola secondaria (Gymnasium LunarLander-v3 & PPO)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Emanuele Ciccarelli" }
]
keywords = [
    "reinforcement-learning",
    "education",
    "lunar-lander",
    "ppo",
    "gymnasium",
    "stable-baselines3",
    "colab"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "gymnasium[box2d]>=0.29.0",
    "stable-baselines3>=2.1.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "imageio>=2.30.0",
    "imageio-ffmpeg>=0.4.8",
    "pillow>=9.5.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "pygame>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ipykernel>=6.20.0",
    "jupyterlab>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/EmanueleCiccarelli/RL_school"
Repository = "https://github.com/EmanueleCiccarelli/RL_school.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["play2learn_core*", "play2learn_lunarlander*", "play2learn_hillclimb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
